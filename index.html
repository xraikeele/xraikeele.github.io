<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        .banner {
            width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="banner">
        <video id="logoVideo" class="banner" autoplay muted playsinline>
            <source src="{{ '/assets/videos/horizontal-logo-video.mp4' | relative_url }}" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <img src="./XRAI-webicon.png" alt="Fallback Image" class="banner">
    </div>
    <script>
        document.getElementById('logoVideo').addEventListener('ended', function() {
            this.pause();
            this.currentTime = this.duration;
        }, false);
    </script>
</body>
</html>
